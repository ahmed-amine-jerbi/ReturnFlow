# ReturnFlow full stack: web (nginx) -> API (.NET) -> AI service (Python) + PostgreSQL.
# Only the web container is published, on port 8080, so a phone needs one URL: http://<PC-IP>:8080
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: returnflow
      POSTGRES_USER: returnflow
      POSTGRES_PASSWORD: returnflow_dev
    volumes:
      - returnflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returnflow -d returnflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  ai:
    build: ./returnflow-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./returnflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      # Development mode enables the demo users, demo data and /scalar. See README before exposing this publicly.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=returnflow;Username=returnflow;Password=returnflow_dev"
      Jwt__Key: "${JWT_KEY:-DEV_ONLY_change_me_to_a_long_random_secret_32+_chars}"
      Seed__DemoData: "${DEMO_MODE:-true}"
      Seed__Password: "${DEMO_PASSWORD:-ChangeMe123!}"
      Ai__BaseUrl: "http://ai:8000/"

  web:
    build: ./returnflow-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  returnflow-data:
