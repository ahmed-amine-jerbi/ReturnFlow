name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ReturnFlow.slnx

      - name: Build
        run: dotnet build ReturnFlow.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ReturnFlow.slnx --no-build -c Release --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t returnflow-api:ci .
