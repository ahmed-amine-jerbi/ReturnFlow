# Database only, for running the API from your IDE with `dotnet run`.
# To run the whole stack (web + API + AI + database), use the docker-compose.yml one folder up.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: returnflow
      POSTGRES_USER: returnflow
      POSTGRES_PASSWORD: returnflow_dev
    ports:
      - "5432:5432"
    volumes:
      - returnflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returnflow -d returnflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  returnflow-data:
