server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # One public port: the web app and the API share an origin, so there is no CORS and phones only need one URL.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location = /health  { proxy_pass http://api:8080/health; }
  location /scalar    { proxy_pass http://api:8080; }
  location /openapi   { proxy_pass http://api:8080; }

  # The service worker and manifest must never be cached for long, or updates would not reach phones.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location / { try_files $uri /index.html; }
}
