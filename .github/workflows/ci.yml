name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: returnflow-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ReturnFlow.slnx
      - name: Check formatting
        run: dotnet format ReturnFlow.slnx --verify-no-changes --no-restore
      - name: Build (analyzers, warnings as errors)
        run: dotnet build ReturnFlow.slnx -c Release --no-restore
      - run: dotnet test ReturnFlow.slnx -c Release --no-build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: returnflow-ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: returnflow-ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: returnflow-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: returnflow-web/package-lock.json
      - run: npm ci
      - name: Lint and check formatting
        run: npx biome ci .
      - name: Typecheck and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, ai, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
